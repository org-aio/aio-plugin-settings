[package]
name = "aio-plugin-settings"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
aio-plugin-identity-model = { git = "https://github.com/zjarlin/aio-plugin-identity.git", rev = "44405701aa16e5e89255d8905c8b0eec60d5e6bf" }
az-dioxus-admin-shell = { git = "https://github.com/zjarlin/dioxus-admin-workbench.git", rev = "75f69b0cfab604d6ab1047b967c1adb72a2a0521" }
az-ui-components = { git = "https://github.com/zjarlin/dioxus-admin-workbench.git", rev = "75f69b0cfab604d6ab1047b967c1adb72a2a0521" }
dill = "0.15.0"
dioxus = { version = "=0.7.9", default-features = false, features = ["macro", "html", "signals"] }
dioxus-icons = { version = "0.1.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
gloo-net = { version = "0.6.0", features = ["http", "json"] }

[lints.rust]
unsafe_code = "forbid"
