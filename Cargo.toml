[package]
name = "aio-plugin-settings"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
aio-plugin-identity-model = { git = "https://github.com/zjarlin/aio-plugin-identity.git", rev = "fea3e38ec25a469d53028c6ca0f0acc58473a396" }
az-dioxus-admin-shell = { git = "https://github.com/zjarlin/dioxus-admin-workbench.git", rev = "cc676107118a3fa83ac891dd97e35279ab9bebbd" }
az-ui-components = { git = "https://github.com/zjarlin/dioxus-admin-workbench.git", rev = "cc676107118a3fa83ac891dd97e35279ab9bebbd" }
dill = "0.15.0"
dioxus = { version = "=0.7.9", default-features = false, features = ["macro", "html", "signals"] }
dioxus-icons = { version = "0.1.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
gloo-net = { version = "0.6.0", features = ["http", "json"] }

[lints.rust]
unsafe_code = "forbid"
